<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <title>SteelSpy — Auditor de Obra</title>
  <link rel="manifest" href="./manifest.json">
  <link href="./assets/app.css" rel="stylesheet">
  <!-- Configuração: apiBaseUrl obrigatório; obraId opcional (pré-preenche o campo) -->
  <script type="application/json" id="stellspy-config">
  {"apiBaseUrl": "", "obraId": ""}
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white p-4 shadow-lg border-b-4 border-black">
    <h1 class="text-2xl font-black tracking-tight">SteelSpy</h1>
    <p class="text-sm font-semibold opacity-90">Auditoria de recebimento</p>
  </header>

  <main class="p-4 flex-grow w-full max-w-lg mx-auto">
    <p id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></p>

    <p id="configWarning" class="hidden mb-4 p-4 bg-amber-100 border-4 border-black text-sm font-bold text-amber-950 rounded-xl">
      Preencha <span class="font-mono">apiBaseUrl</span> no bloco <span class="font-mono">#stellspy-config</span> (JSON no &lt;head&gt;).
    </p>

    <section id="loginBlock" class="bg-white p-5 rounded-xl border-4 border-black shadow-[4px_4px_0_#000] mb-5" aria-labelledby="titulo-auth">
      <h2 id="titulo-auth" class="text-lg font-black mb-3 uppercase">Acesso</h2>
      <p class="text-sm font-bold mb-3">
        <span id="sessionBadge" class="inline-block px-2 py-1 rounded-lg text-white bg-slate-600">Sem sessão</span>
      </p>
      <label class="flex items-start gap-3 mb-4 cursor-pointer">
        <input type="checkbox" id="useHeaderKey" class="mt-1 h-5 w-5 border-4 border-black rounded accent-blue-600">
        <span class="text-sm font-bold leading-snug">Enviar <span class="font-mono">X-API-KEY</span> em cada requisição (dev / sem cookie entre domínios)</span>
      </label>
      <label for="apiKey" class="block text-sm font-bold mb-1">API Key da obra</label>
      <input type="password" id="apiKey" autocomplete="current-password"
             class="w-full p-3 mb-3 border-4 border-black rounded-lg font-mono text-sm focus:outline-none focus:ring-4 focus:ring-blue-500"
             placeholder="login: apagada após entrar · modo header: enviada a cada chamada">
      <div id="cookieActions">
        <button type="button" id="btnLogin" onclick="stellspyLogin()"
                class="touch-btn w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl border-4 border-black mb-2">
          Entrar na obra (cookie)
        </button>
        <button type="button" id="btnLogout" onclick="stellspyLogout()"
                class="touch-btn w-full bg-white hover:bg-gray-100 text-black font-bold rounded-xl border-4 border-black text-sm">
          Sair
        </button>
      </div>
      <p id="loginError" class="hidden mt-3 p-3 bg-red-100 border-4 border-red-800 text-red-950 font-bold text-sm" role="alert"></p>
    </section>

    <section class="bg-white p-5 rounded-xl border-4 border-black shadow-[4px_4px_0_#000] mb-5" aria-labelledby="titulo-form">
      <h2 id="titulo-form" class="text-lg font-black mb-4 uppercase">Conferir NF-e</h2>

      <label for="obraId" class="block text-sm font-bold mb-1">Obra (UUID)</label>
      <input type="text" id="obraId" inputmode="text" autocomplete="off"
             class="w-full p-3 mb-4 border-4 border-black rounded-lg font-mono text-sm focus:outline-none focus:ring-4 focus:ring-blue-500"
             placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">

      <label for="nfeKey" class="block text-sm font-bold mb-1">Chave de acesso (44 dígitos)</label>
      <input type="text" id="nfeKey" inputmode="numeric" autocomplete="off" maxlength="54"
             class="field-key w-full p-4 mb-2 border-4 border-black rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500"
             placeholder="somente números">
      <p class="text-sm font-bold mb-4"><span id="digitCount">0</span> / 44 dígitos</p>

      <p id="formError" class="hidden mb-3 p-3 bg-red-100 border-4 border-red-800 text-red-950 font-bold text-sm" role="alert"></p>

      <button type="button" id="btnCheck" onclick="stellspyConferir()"
              class="touch-btn w-full bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl border-4 border-black flex justify-center items-center gap-3">
        CONFERIR MATERIAL
      </button>
    </section>

    <section id="resultArea" class="hidden" aria-label="Resultado da conferência">
      <div id="statusCard" class="status-card rounded-xl p-6 mb-4 text-center">
        <div id="statusIcon" class="text-6xl mb-2 leading-none" aria-hidden="true"></div>
        <h2 id="statusTitle" class="text-2xl font-black uppercase mb-2"></h2>
        <p id="statusDesc" class="text-base font-bold leading-snug"></p>
        <p id="statusMensagemFiscal" class="hidden mt-3 text-sm font-bold leading-snug whitespace-pre-wrap border-t-4 border-black/20 pt-3"></p>
        <p id="statusResumo" class="mt-3 text-sm font-bold opacity-95 hidden"></p>
      </div>

      <div id="detailsArea" class="bg-white rounded-xl p-4 mb-4 border-4 border-black text-sm font-semibold">
      </div>

      <button type="button" id="btnPdf" onclick="stellspyLaudo()"
              class="hidden touch-btn w-full bg-white hover:bg-gray-100 text-black font-black rounded-xl border-4 border-black mb-3">
        ABRIR LAUDO PDF
      </button>
      <button type="button" id="btnPdfDiv" onclick="stellspyDivergenciasPdf()"
              class="hidden touch-btn w-full bg-slate-100 hover:bg-slate-200 text-black font-bold rounded-xl border-4 border-black mb-3 text-sm">
        PDF DIVERGÊNCIAS (POR ITEM)
      </button>
      <p id="pdfHint" class="hidden text-xs font-bold text-center mb-4">O PDF abre na mesma sessão (autenticado). Use compartilhar do navegador para o WhatsApp.</p>
    </section>
  </main>

  <div
    id="toast-container"
    class="fixed bottom-4 right-4 z-50 flex flex-col items-end pointer-events-none"
    aria-live="polite"
    aria-relevant="additions"
  ></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
