<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light">
  <title>SteelSpy — Auditor de Obra</title>
  <link rel="manifest" href="./manifest.json">
  <link href="./assets/app.css" rel="stylesheet">
  <!-- Configuração: apiBaseUrl obrigatório (origem da API FastAPI).
       Vazio = mesma origem do PWA, que é o deploy normal. Para apontar o
       celular para uma API em outra porta, preencha aqui. -->
  <script type="application/json" id="stellspy-config">
  {"apiBaseUrl": ""}
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white p-4 shadow-lg border-b-4 border-black sticky top-0 z-30">
    <div class="flex items-end justify-between gap-2">
      <div>
        <h1 class="text-2xl font-black tracking-tight">SteelSpy</h1>
        <p class="text-sm font-semibold opacity-90">Auditoria de recebimento</p>
      </div>
      <p class="text-xs font-bold text-right">
        <span id="qQuem" class="block"></span>
        <span id="qOnde" class="block opacity-80"></span>
      </p>
    </div>
  </header>

  <main id="tela" class="p-4 flex-grow w-full max-w-lg mx-auto" aria-live="polite">
    <p class="text-sm font-bold">Carregando…</p>
  </main>

  <nav id="nav" class="hidden sticky bottom-0 z-30 bg-white border-t-4 border-black grid grid-cols-4"
       aria-label="Navegação principal">
    <button type="button" class="nav-btn" data-rota="obra">PAINEL</button>
    <button type="button" class="nav-btn" data-rota="recebimento">RECEBER</button>
    <button type="button" class="nav-btn" data-rota="pedidos">PEDIDOS</button>
    <button type="button" class="nav-btn" data-rota="historico">HISTÓRICO</button>
  </nav>

  <p id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></p>

  <div
    id="toast-container"
    class="fixed bottom-4 right-4 z-50 flex flex-col items-end pointer-events-none"
  ></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
